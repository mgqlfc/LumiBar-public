name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (blank uses the project version)'
        required: false
        default: ''
        type: string
      include_antigravity:
        description: 'Include the Antigravity frontend plugin'
        required: true
        default: false
        type: boolean
      publish_prerelease:
        description: 'Publish a Windows 11 x64 pre-release with the EXE installer'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    name: Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 35
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Resolve version
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version=$env:REQUESTED_VERSION.Trim()
          if(-not$version){
            [xml]$project=Get-Content -LiteralPath work/LumiBar/LumiBar.csproj -Raw
            $version=[string]$project.Project.PropertyGroup.Version
          }
          if($version-notmatch'^\d+\.\d+\.\d+$'){throw 'Use a numeric major.minor.patch version.'}
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Run backend and configuration tests
        run: |
          dotnet run --project work/BackendTests/BackendTests.csproj -c Release
          if($LASTEXITCODE-ne0){throw 'Backend tests failed'}
          dotnet run --project work/FrontendSupportTests/FrontendSupportTests.csproj -c Release
          if($LASTEXITCODE-ne0){throw 'Configuration tests failed'}
      - name: Build native taskbar bridge
        run: '& ./work/TaskbarBridge/build.ps1'
      - name: Install Inno Setup
        run: |
          choco install innosetup --yes --no-progress
          if($LASTEXITCODE-ne0){throw 'Inno Setup installation failed'}
      - name: Build installer
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          INCLUDE_ANTIGRAVITY: ${{ inputs.include_antigravity }}
        run: |
          & ./work/installer/build-release.ps1 -Version $env:RELEASE_VERSION -IncludeAntigravity:($env:INCLUDE_ANTIGRAVITY-eq'true')
          $hashes=Get-ChildItem -LiteralPath outputs/安装包 -Filter '*-setup.exe' | ForEach-Object {
            $hash=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $hashes | Set-Content -LiteralPath outputs/安装包/SHA256SUMS.txt -Encoding utf8
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: LumiBar-${{ steps.release.outputs.version }}-windows-x64
          path: |
            outputs/安装包/*-setup.exe
            outputs/安装包/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish Windows 11 pre-release
        if: ${{ inputs.publish_prerelease }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $version=$env:RELEASE_VERSION
          $original=Join-Path 'outputs/安装包' "LumiBar-$version-windows-x64-setup.exe"
          if(-not(Test-Path -LiteralPath $original)){
            throw 'Pre-release publishing currently requires the native Windows installer; leave include_antigravity unchecked.'
          }
          $asset=Join-Path 'outputs/安装包' "LumiBar-$version-Windows11-x64-Setup.exe"
          Copy-Item -LiteralPath $original -Destination $asset
          $hash=(Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          $notesFile=Join-Path 'work/installer' "RELEASE-NOTES-$version.md"
          $notes=if(Test-Path -LiteralPath $notesFile){Get-Content -LiteralPath $notesFile -Raw}else{'Windows 11 x64 EXE 安装版。中文默认思源黑体，西文默认 Geist。'}
          $notes+="`n`nSHA-256: $hash`n"
          $body=Join-Path $env:RUNNER_TEMP 'lumibar-release-notes.md'
          [IO.File]::WriteAllText($body,$notes,[Text.UTF8Encoding]::new($false))
          $tag="v$version-preview.1"
          gh release create $tag $asset --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title "LumiBar $version 预发布 · Windows 11 x64" --notes-file $body
          if($LASTEXITCODE-ne0){throw 'Pre-release publishing failed'}
          "Published $tag with Windows 11 installer" >> $env:GITHUB_STEP_SUMMARY
